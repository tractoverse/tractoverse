url: https://tractoverse.github.io/tractoverse/
template:
  bootstrap: 5
  bootswatch: darkly
  # Dark syntax highlighting to match the darkly shell.
  theme: arrow-dark
  # pkgdown/extra.scss applies the tractoverse dark brand (shell + accent +
  # typography) on top of the Bootswatch darkly base. Tokens mirror
  # inst/brand/_brand.yml.
  includes:
    in_header: |
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
        // pkgdown renders README.qmd mermaid blocks with pandoc (not Quarto), which wraps
        // the diagram text in <pre class="mermaid"><code>…</code></pre>. mermaid's own
        // startOnLoad/run() mis-reads that nested markup ("No diagram type detected"), so
        // drive rendering explicitly from the element's textContent. README.qmd is the single
        // source for both the GitHub README (mermaid renders natively there) and this home page.
        mermaid.initialize({ startOnLoad: false });
        document.addEventListener("DOMContentLoaded", async () => {
          for (const el of document.querySelectorAll(".mermaid")) {
            try {
              const { svg } = await mermaid.render("mm", el.textContent);
              el.innerHTML = svg;
            } catch (e) { el.dataset.mmError = String((e && e.message) || e); }
          }
        });
      </script>
reference:
- title: The tractoverse family
  desc: The core packages and the shared brand.
  contents:
  - tractoverse_packages
  - install_core_packages
  - tractoverse_brand
  - tractoverse_theme
